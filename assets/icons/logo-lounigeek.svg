<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="lg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A6E5"/>
      <stop offset="50%" stop-color="#A73178"/>
      <stop offset="100%" stop-color="#23215F"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A73178"/>
      <stop offset="100%" stop-color="#C9A6E5"/>
    </linearGradient>
  </defs>
  
  <!-- Símbolo Geométrico LG Stylized Origami / Prism -->
  <g transform="translate(4, 5)">
    <!-- Asa / Prisma Esquerdo -->
    <path d="M4 36 L16 8 L28 20 L16 36 Z" fill="url(#lg-grad)" />
    <!-- Asa / Prisma Direito -->
    <path d="M16 8 L36 14 L28 28 L16 22 Z" fill="url(#accent-grad)" opacity="0.9" />
    <!-- Detalhe de luz central -->
    <path d="M16 22 L28 28 L20 38 L12 36 Z" fill="#23215F" />
    <path d="M28 20 L38 24 L32 38 L22 36 Z" fill="url(#lg-grad)" opacity="0.8" />
  </g>

  <!-- Tipografia LOUNIGEEK -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="22" letter-spacing="2" fill="#23215F">
    LOUNI<tspan fill="#A73178">GEEK</tspan>
  </text>
</svg>

